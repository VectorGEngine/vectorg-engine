[package]
name = "vectorg-engine-examples-3d-f64"
version = "0.1.0"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
edition = "2021"
rust-version = "1.82"
default-run = "all_examples3-f64"

[features]
parallel = ["vectorg-engine-f64/parallel", "vectorg-engine-testbed-3d-f64/parallel"]
simd-stable = ["vectorg-engine-f64/simd-stable"]
simd-nightly = ["vectorg-engine-f64/simd-nightly"]
enhanced-determinism = ["vectorg-engine-f64/enhanced-determinism"]

[dependencies]
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
obj-rs = { version = "0.7", default-features = false }
bincode = "1"
serde = "1"

[dependencies.vectorg-engine-testbed-3d-f64]
path = "../crates/vectorg-engine-testbed-3d-f64"

[dependencies.vectorg-engine-f64]
path = "../crates/vectorg-engine-f64"

[[bin]]
name = "all_examples3-f64"
path = "./all_examples3-f64.rs"

#[lib]
#crate-type = ["cdylib", "rlib"]
#path = "./all_examples3_wasm.rs"

