name: VectorG Engine CI build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  check-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: cargo fmt -- --check
  doc:
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: Cargo doc
        run: cargo doc --features parallel,simd-stable,serde-serialize,debug-render -p vectorg-engine -p vectorg-engine-2d -p vectorg-engine-meshloader -p vectorg-engine-urdf
      - name: Create documentation landing page
        run: printf '<meta http-equiv="refresh" content="0; url=vectorg_engine/index.html">' > target/doc/index.html
      - name: Upload documentation for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: target/doc
  build-native:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y cmake libxcb-composite0-dev
      - name: Clippy
        run: cargo clippy
      - name: Clippy vectorg-engine-2d
        run: cargo clippy -p vectorg-engine-examples-2d --features parallel,simd-stable
      - name: Clippy vectorg-engine
        run: cargo clippy -p vectorg-engine-examples-3d --features parallel,simd-stable
      - name: Build vectorg-engine-2d
        run: cargo build --verbose -p vectorg-engine-2d;
      - name: Build vectorg-engine
        run: cargo build --verbose -p vectorg-engine;
      - name: Build vectorg-engine-2d SIMD
        run: cd crates/vectorg-engine-2d; cargo build --verbose --features simd-stable;
      - name: Build vectorg-engine SIMD
        run: cd crates/vectorg-engine; cargo build --verbose --features simd-stable;
      - name: Build vectorg-engine-2d SIMD Parallel
        run: cd crates/vectorg-engine-2d; cargo build --verbose --features simd-stable --features parallel;
      - name: Build vectorg-engine SIMD Parallel
        run: cd crates/vectorg-engine; cargo build --verbose --features simd-stable --features parallel;
      - name: Run tests
        run: cargo test
      - name: Check vectorg-engine-testbed-2d
        run: cargo check --verbose -p vectorg-engine-testbed-2d;
      - name: Check vectorg-engine-testbed-3d
        run: cargo check --verbose -p vectorg-engine-testbed-3d;
      - name: Check vectorg-engine-testbed-2d --features parallel
        run: cd crates/vectorg-engine-testbed-2d; cargo check --verbose --features parallel;
      - name: Check vectorg-engine-testbed-3d --features parallel
        run: cd crates/vectorg-engine-testbed-3d; cargo check --verbose --features parallel;
      - name: Check vectorg-engine-testbed-2d --features enhanced-determinism
        run: cd crates/vectorg-engine-2d; cargo check --verbose --features enhanced-determinism;
      - name: Check vectorg-engine-testbed-3d --features enhanced-determinism
        run: cd crates/vectorg-engine; cargo check --verbose --features enhanced-determinism;
      - name: Check vectorg-engine-examples-2d
        run: cargo check -j 1 --verbose -p vectorg-engine-examples-2d;
      - name: Check vectorg-engine-examples-3d
        run: cargo check -j 1 --verbose -p vectorg-engine-examples-3d;
  build-wasm:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-unknown
      - name: build vectorg-engine-2d
        run: cd crates/vectorg-engine-2d && cargo build --verbose --target wasm32-unknown-unknown;
      - name: build vectorg-engine
        run: cd crates/vectorg-engine && cargo build --verbose --target wasm32-unknown-unknown;
  build-wasm-emscripten:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add wasm32-unknown-emscripten
      - name: build vectorg-engine-2d
        run: cd crates/vectorg-engine-2d && cargo build --verbose --target wasm32-unknown-emscripten;
      - name: build vectorg-engine
        run: cd crates/vectorg-engine && cargo build --verbose --target wasm32-unknown-emscripten;
      - name: build vectorg-engine-2d --features simd-stable
        run: cd crates/vectorg-engine-2d && cargo build --verbose --target wasm32-unknown-emscripten --features simd-stable;
      - name: build vectorg-engine --features simd-stable
        run: cd crates/vectorg-engine && cargo build --verbose --target wasm32-unknown-emscripten --features simd-stable;
  # If this fails, consider changing your text or adding something to .typos.toml
  # You can find typos here: https://crates.io/crates/typos'
  typos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: check typos
        uses: crate-ci/typos@v1.23.2
  publish-dry-run:
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - name: publish dry-run
        run: ./publish-all.sh
  deploy-docs:
    runs-on: ubuntu-latest
    needs: [doc]
    if: github.ref == 'refs/heads/master'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy VectorG Engine documentation
        id: deployment
        uses: actions/deploy-pages@v4
