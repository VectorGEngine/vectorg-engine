[package]
name = "vectorg-engine-examples-3d"
version = "0.1.0"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
edition = "2021"
rust-version = "1.82"
default-run = "all_examples3"

[features]
parallel = ["vectorg-engine/parallel", "vectorg-engine-testbed-3d/parallel"]
simd-stable = ["vectorg-engine/simd-stable"]
simd-nightly = ["vectorg-engine/simd-nightly"]
other-backends = ["vectorg-engine-testbed-3d/other-backends"]
enhanced-determinism = ["vectorg-engine/enhanced-determinism"]

[dependencies]
rand = "0.8"
getrandom = { version = "0.2", features = ["js"] }
wasm-bindgen = "0.2"
obj-rs = { version = "0.7", default-features = false }
serde = "1"
bincode = "1"
serde_json = "1"
dot_vox = "5"

[dependencies.vectorg-engine-testbed-3d]
path = "../crates/vectorg-engine-testbed-3d"
features = ["profiler_ui"]

[dependencies.vectorg-engine]
path = "../crates/vectorg-engine"

[dependencies.vectorg-engine-urdf]
path = "../crates/vectorg-engine-urdf"
features = ["stl"]

[[bin]]
name = "all_examples3"
path = "./all_examples3.rs"

[[bin]]
name = "harness_capsules3"
path = "./harness_capsules3.rs"

#[lib]
#crate-type = ["cdylib", "rlib"]
#path = "./all_examples3_wasm.rs"
