[package]
name = "vectorg-engine-examples-2d"
version = "0.1.0"
authors = ["Sébastien Crozet <sebcrozet@dimforge.com>"]
edition = "2021"
rust-version = "1.82"
default-run = "all_examples2"

[features]
parallel = ["vectorg-engine-2d/parallel", "vectorg-engine-testbed-2d/parallel"]
simd-stable = ["vectorg-engine-2d/simd-stable"]
simd-nightly = ["vectorg-engine-2d/simd-nightly"]
other-backends = ["vectorg-engine-testbed-2d/other-backends"]
enhanced-determinism = ["vectorg-engine-2d/enhanced-determinism"]

[dependencies]
rand = "0.8"
lyon = "0.17"
usvg = "0.14"
dot_vox = "5"

[dependencies.vectorg-engine-testbed-2d]
path = "../crates/vectorg-engine-testbed-2d"
features = ["profiler_ui"]

[dependencies.vectorg-engine-2d]
path = "../crates/vectorg-engine-2d"

[[bin]]
name = "all_examples2"
path = "./all_examples2.rs"
